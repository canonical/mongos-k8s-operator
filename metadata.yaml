name: mongos-k8s
display-name: mongos-k8s
description: |
  mongos is a router/proxy used for sharded MongoDB clusters. This charm
  deploys and operates mongos as a charm on K8s.
docs: https://discourse.charmhub.io/t/charmed-mongos-k8s-documentation/15817
source: https://github.com/canonical/mongos-k8s-operator
issues: https://github.com/canonical/mongos-k8s-operator/issues
website:
  - https://github.com/canonical/mongos-k8s-operator
  - https://chat.charmhub.io/charmhub/channels/data-platform
summary: A mongos k8s operator charm

peers:
  router-peers:
    interface: mongos-peers
  ldap-peers:
    # Stores the data for the ldap relation.
    interface: ldap-peers
  status-peers:
    interface: status-peers
  refresh-v-three:
    # Relation versioning scheme: https://canonical-charm-refresh.readthedocs-hosted.com/latest/
    interface: refresh
  rollingops-peers:
    interface: rollingops-peers

requires:
  peer-certificates:
    interface: tls-certificates
    limit: 1
    optional: true
  client-certificates:
    interface: tls-certificates
    limit: 1
    optional: true
  cluster:
    interface: config-server
    limit: 1
  ldap:
    interface: ldap
    limit: 1
    optional: true
  ldap-certificate-transfer:
    interface: certificate_transfer
    limit: 1
    optional: true

provides:
  mongos_proxy:
    interface: mongodb_client
containers:
  mongos:
    resource: mongodb-image
resources:
  mongodb-image:
    type: oci-image
    description: OCI image for mongodb
    # TODO: Update sha whenever upstream rock changes
    upstream-source: ghcr.io/canonical/charmed-mongodb@sha256:b519b66d0259b7aaff634f467c8ab8ff9737bdc64b24c10e4af514e5e419bb0c
