[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"


[tool.poetry.dependencies]
lightkube = "^0.19.1"
python = "^3.10"
ops = ">=2.23.2"
pymongo = "^4.16.0"
pyyaml = "^6.0.3"
jinja2 = "^3.1.6"
poetry-core = "^2.3.2"
data-platform-helpers = "^0.1.7"
# FIXME: Unpin once rustc 1.76 is available at build time
rpds-py = "<0.31"
overrides = "^7.7.0"
mongo-charms-single-kernel = "1.8.35"

[tool.poetry.group.charm-libs.dependencies]
# data_platform_libs/v0/data_interfaces.py
ops = ">=2.21"
pydantic = "*"  # cos_agent lib
cryptography = "*"  # tls_certificates lib v3
jsonschema = "^4.24.0"  # tls_certificates lib v3
cosl = "*"  # loki_push_api

[tool.poetry.group.build-refresh-version]
optional = true

[tool.poetry.group.build-refresh-version.dependencies]
charm-refresh-build-version = "^0.4.1"



[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.group.format]
optional = true

[tool.poetry.group.format.dependencies]
ruff = "^0.15.9"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "^0.15.9"
codespell = "^2.4.2"
shellcheck-py = "^0.10.0.1"

[tool.poetry.group.integration.dependencies]
ops = ">=2.23.2"
allure-pytest = "^2.15.3"
pymongo = "^4.16.0"
parameterized = "^0.9.0"
lightkube = "^0.19.1"
kubernetes = "^30.1.0"
juju = "^3.5.0"
pytest = "^8.4.2"
pytest-mock = "^3.15.1"
pytest-operator = "^0.43.2"
pytest-operator-groups = {git = "https://github.com/canonical/data-platform-workflows", tag = "v35.0.4", subdirectory = "python/pytest_plugins/pytest_operator_groups"}
pytest-github-secrets = {git = "https://github.com/canonical/data-platform-workflows", tag = "v35.0.4", subdirectory = "python/pytest_plugins/github_secrets"}
allure-pytest-collection-report = {git = "https://github.com/canonical/data-platform-workflows", tag = "v35.0.4", subdirectory = "python/pytest_plugins/allure_pytest_collection_report"}


# Linting tools configuration
mongo-charms-single-kernel = "1.8.35"
[tool.flake8]
max-line-length = 99
max-doc-length = 99
max-complexity = 10
exclude = [".git", "__pycache__", ".tox", "build", "dist", "*.egg_info", "venv", "tests/integration/relation_tests/application-charm/lib/", "tests/integration/ha_tests/application_charm/lib/"]
select = ["E", "W", "F", "C", "N", "R", "D", "H"]
# Ignore W503, E501 because using black creates errors with this
# Ignore D107 Missing docstring in __init__
ignore = ["W503", "E501", "D107"]
# D100, D101, D102, D103: Ignore missing docstrings in tests
per-file-ignores = ["tests/*:D100,D101,D102,D103,D104"]
docstring-convention = "google"
# Check for properly formatted copyright header in each file
copyright-check = "True"
copyright-author = "Canonical Ltd."
copyright-regexp = "Copyright\\s\\d{4}([-,]\\d{4})*\\s+%(author)s"
